name: ZenGo
description: 'ZenGo (also styled Zengo) is a consumer, non-custodial keyless cryptocurrency
  wallet that replaces the traditional seed phrase with MPC (multi-party computation)
  threshold signatures, splitting the signing key into two independent secret shares
  so there is no single point of failure or seed phrase to lose. Through its iOS and
  Android mobile apps and browser extension, users can buy, sell, trade and store
  Bitcoin, Ethereum and other crypto assets, connect to Web3 dApps and NFTs, and access
  features such as prediction markets. Founded circa 2018 (formerly KZen Networks)
  and backed by Insight Partners, the company also publishes open-source MPC and
  threshold-signature cryptography research through its ZenGo-X GitHub organization.
  As a consumer wallet product, ZenGo does not currently expose a public developer
  or product API.'
